<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; connect-src https://*.supabase.co https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
<title>Apollo 13: Fix the Air</title>
<link rel="stylesheet" href="css/styles.css?v=1.2">
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="3D cabin"></canvas>
<div id="vig"></div><div id="red"></div>
<div id="dragGhost" aria-hidden="true"></div>

<div id="hud" class="hide">
  <div class="bar">
    <span><span id="tPlayer">Player</span>: <b id="tn">-</b></span>
    <span>⏱ <b id="tm">5:00</b></span>
    <div class="meter">
      <div>CO₂ <b id="cp">15%</b> · <b id="cs">SAFE</b></div>
      <div class="track" role="progressbar" aria-label="CO2" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15"><div id="fill"></div></div>
    </div>
    <button id="bHint" title="Hint">💡 <span id="tHint">Hint</span> <span id="hl">3</span></button>
    <button id="bPause" aria-label="Pause">⏸</button>
    <button id="bView" aria-label="Reset view">🎯</button>
    <button id="bMute" aria-pressed="false" aria-label="Mute">🔊</button>
    <button id="bFs" aria-label="Fullscreen">⛶</button>
    <span class="lang-bar">
      <button type="button" id="langEN" aria-pressed="true">EN</button>
      <button type="button" id="langFR" aria-pressed="false">FR</button>
    </span>
  </div>
  <div id="telemetry" class="telemetry" aria-live="polite">
    <span class="tel-item" data-role="shape"><i></i><span id="telShape">Body: —</span></span>
    <span class="tel-item" data-role="sleeve"><i></i><span id="telSleeve">Envelope: —</span></span>
    <span class="tel-item" data-role="hose"><i></i><span id="telHose">Airflow: —</span></span>
    <span class="tel-item" data-role="seal"><i></i><span id="telSeal">Seal: —</span></span>
  </div>
  <div id="ban" class="hide" role="alert">⚠ CO₂ CRITICAL</div>
  <details class="side" open>
    <summary id="tBriefSum">Mission brief</summary>
    <div id="brief" class="mu" style="font-size:.85rem;line-height:1.4">
      <p id="tBriefSit" style="margin:.3rem 0"></p>
      <p id="tBriefObj" style="margin:.3rem 0"></p>
      <ul style="margin:.2rem 0;padding-left:1.2rem">
        <li id="tObjCan"></li><li id="tObjCov"></li><li id="tObjBag"></li>
        <li id="tObjHose"></li><li id="tObjTape"></li><li id="tObjAlt"></li>
      </ul>
      <p id="tBriefTip" style="margin:.3rem 0"></p>
    </div>
    <details><summary id="tRealSizes">Real sizes</summary><div id="facts" class="mu"></div></details>
  </details>
  <div class="bot">
    <div id="sub" role="status" aria-live="polite"></div>
    <div style="display:flex;gap:8px;align-items:stretch">
      <div id="inv" aria-label="Inventory" style="flex:1"></div>
      <button id="bPlace" class="pri">Place</button>
    </div>
  </div>
</div>

<!-- Phase 1: Think – briefing MCQ -->
<div id="briefing" class="ov hide" role="dialog" aria-labelledby="briefTitle">
  <div class="card">
    <p class="warn" id="briefAlert" style="margin-top:0"></p>
    <h2 id="briefTitle" style="font-size:1.15rem;margin:.4rem 0"></h2>
    <p id="briefPrompt" class="mu" style="margin:.4rem 0 .8rem"></p>
    <div id="briefChoices" class="brief-choices"></div>
    <p id="briefFeedback" class="err" role="status" style="min-height:1.4em"></p>
  </div>
</div>

<div id="nick" class="ov">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <h1 id="tNickTitle" style="margin:0">🚀 Apollo 13</h1>
      <span class="lang-bar">
        <button type="button" id="langEN2">EN</button>
        <button type="button" id="langFR2">FR</button>
      </span>
    </div>
    <p id="tNickIntro"></p>
    <div class="row"><label id="tNickLabel">Nickname<input id="sNick" type="text" maxlength="16" autocomplete="off"></label></div>
    <div class="row"><label id="tClassLabel">Class<input id="sClass" type="text" maxlength="8" autocomplete="off"></label></div>
    <p id="nickErr" class="err" role="alert"></p>
    <button id="bNick" class="pri" style="width:100%">Continue</button>
    <p id="tNickLegal" class="mu" style="margin-top:12px;font-size:.85rem"></p>
    <p class="mu" style="font-size:.75rem;margin:6px 0 0">Build <span id="ver">-</span></p>
  </div>
</div>

<div id="start" class="ov hide">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <h1 id="tStartTitle" style="margin:0">🚀 Apollo 13</h1>
      <span class="lang-bar">
        <button type="button" id="langEN3">EN</button>
        <button type="button" id="langFR3">FR</button>
      </span>
    </div>
    <p id="tStory"></p>
    <div class="steps"><div id="tStep1"></div><div id="tStep2"></div><div id="tStep3"></div></div>
    <div class="row">
      <label id="tTimeLabel">Time
        <select id="sDur">
          <option value="180" id="opt3">3 min</option>
          <option value="300" selected id="opt5">5 min</option>
          <option value="480" id="opt8">8 min</option>
        </select>
      </label>
      <label id="tTeamsLabel">Teams<input id="sTeams" type="text" maxlength="90" value="" autocomplete="off"></label>
    </div>
    <div class="row">
      <label id="tVolLabel">Volume <input id="sVol" type="range" min="0" max="1" step=".05" value=".6"></label>
      <label style="flex-direction:row;align-items:center"><input id="sRed" type="checkbox"> <span id="tReduced">Reduced</span></label>
    </div>
    <p id="tWarn" class="warn"></p>
    <p class="mu"><span id="tPlayingAs">Playing as:</span> <b id="dispNick">-</b> · <a id="tViewBoard" href="leaderboard.html" target="_blank" rel="noopener">Board</a></p>
    <button id="bStart" class="pri" style="width:100%">Start</button>
  </div>
</div>

<div id="intro" class="ov intro hide" aria-live="polite">
  <div class="introBox"><p id="introTxt"></p><button id="bSkip" type="button">Skip intro ▶</button></div>
</div>

<div id="pause" class="ov hide">
  <div class="card">
    <h2 id="tPaused">Paused</h2>
    <p id="tPausedMu" class="mu"></p>
    <button id="bResume" class="pri">Resume</button>
    <div class="lang-bar" style="margin-top:12px">
      <button type="button" id="langEN4">EN</button>
      <button type="button" id="langFR4">FR</button>
    </div>
  </div>
</div>

<div id="end" class="ov hide">
  <div class="card">
    <h2 id="eT"></h2>
    <p id="eS"></p>
    <p class="mu" id="eF"></p>
    <div class="compare">
      <div class="box">
        <h3 id="tWhatBuilt">Your assembly</h3>
        <ol id="endChk"></ol>
        <p id="endAssembly" class="mu"></p>
      </div>
      <div class="box">
        <h3 id="tRealSolution">Historical solution</h3>
        <img id="nasmPhoto" src="img/nasm-side.jpg" alt="Smithsonian NASM Apollo 13 CO2 adapter" class="nasm-photo">
        <p id="tRealSteps" class="mu"></p>
        <ul id="debriefBullets" class="debrief"></ul>
      </div>
    </div>
    <div id="rankBox" class="hide" style="margin:12px 0;padding:10px;background:#0b1220;border-radius:10px;border:1px solid var(--ln)">
      <p style="margin:0 0 6px"><b id="tRanks">Ranks</b></p>
      <p id="rankText" class="mu" style="margin:0"></p>
    </div>
    <p id="submitStatus" class="mu" role="status"></p>
    <table><thead><tr><th>Team</th><th>Result</th><th>Score</th></tr></thead><tbody id="eB"></tbody></table>
    <br>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="bNext" class="pri"></button>
      <button id="bRetrySubmit" class="hide">Retry</button>
      <a id="tFullBoard" href="leaderboard.html" target="_blank" rel="noopener" style="align-self:center;color:var(--ac)">Leaderboard</a>
    </div>
    <div class="lang-bar" style="margin-top:12px">
      <button type="button" id="langEN5">EN</button>
      <button type="button" id="langFR5">FR</button>
    </div>
  </div>
</div>

<div id="err" class="ov hide" role="alert">
  <div class="card">
    <h2 id="tErrTitle">Error</h2>
    <p id="eM"></p>
    <p id="tErrWebgl" class="mu"></p>
  </div>
</div>

<script src="config.js?v=1.2"></script>
<script src="js/i18n.js?v=1.2"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module" src="js/game.js?v=1.2"></script>
</body>
</html>
