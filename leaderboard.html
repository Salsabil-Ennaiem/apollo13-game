<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://*.supabase.co https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
<title>Apollo 13 Leaderboard</title>
<style>
:root{--bg:#070a12;--pn:#111827ee;--tx:#eef2f8;--mu:#a7b1c2;--ac:#ffb020;--ok:#3ddc97;--bd:#ff4d4f;--ln:#2b364a}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:16px;max-width:900px;margin:0 auto}
h1{margin:.2rem 0 1rem;font-size:1.8rem;text-align:center}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:16px}
button,select,input{font:inherit;color:var(--tx);min-height:44px;padding:.5rem .9rem;border:1px solid var(--ln);border-radius:10px;background:#1b2536;cursor:pointer}
button:hover,select:hover{border-color:var(--ac)}
button.active,button[aria-pressed=true]{background:var(--ac);color:#111;font-weight:700;border-color:var(--ac)}
input[type=text]{background:#0b1220;min-width:140px}
table{width:100%;border-collapse:collapse;background:var(--pn);border-radius:12px;overflow:hidden;border:1px solid var(--ln)}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--ln)}
th{background:#1b2536;font-weight:600;position:sticky;top:0}
tr:last-child td{border-bottom:none}
tr.me{background:#3a2b08;font-weight:700}
tr.me td:first-child{color:var(--ac)}
.rank{font-variant-numeric:tabular-nums;width:3rem}
.score{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ac)}
.mu{color:var(--mu);font-size:.9rem}
.status{text-align:center;margin:12px 0;min-height:1.4em}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
a{color:var(--ac)}
@media(max-width:600px){body{font-size:16px}th,td{padding:8px 6px}}
</style>
</head>
<body>
<h1>🚀 Apollo 13 Leaderboard</h1>

<div class="card">
  <div class="bar">
    <button id="bToday" class="active" aria-pressed="true">Today</button>
    <button id="bWeek" aria-pressed="false">This Week</button>
    <button id="bAll" aria-pressed="false">All Time</button>
    <label>Class code <input id="classCode" type="text" maxlength="8" placeholder="optional" autocomplete="off"></label>
    <button id="bRefresh">↻ Refresh</button>
  </div>
  <p class="mu" style="text-align:center;margin:0">Auto-refreshes every 10 s · Big text for classroom projector · <a href="index.html">Play the game</a></p>
</div>

<p id="status" class="status" role="status" aria-live="polite">Loading…</p>

<table>
  <thead>
    <tr>
      <th class="rank">#</th>
      <th>Nickname</th>
      <th class="score">Score</th>
      <th>Time left</th>
      <th>Hints</th>
      <th>Mistakes</th>
      <th>When</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<p class="mu" style="text-align:center;margin-top:20px">
  Scores are recomputed on the server from an event log. No emails or real names are stored.<br>
  Data can be deleted on request.
</p>

<script src="config.js"></script>
<script type="module">
// Keys live in config.js – edit only that file
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm";

const cfg = window.A13_CONFIG || {};
const SUPABASE_URL = cfg.SUPABASE_URL || "";
const SUPABASE_ANON_KEY = cfg.SUPABASE_ANON_KEY || "";

const sb = (!SUPABASE_URL || SUPABASE_URL.includes("YOUR_PROJECT"))
  ? null
  : createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
let filter = "today"; // today | week | all
let classCode = "";
let timer = null;

function setFilter(f) {
  filter = f;
  ["bToday","bWeek","bAll"].forEach(id => {
    const b = $(id);
    const active = (id === "bToday" && f === "today") ||
                   (id === "bWeek" && f === "week") ||
                   (id === "bAll" && f === "all");
    b.classList.toggle("active", active);
    b.setAttribute("aria-pressed", String(active));
  });
  load();
}

$("bToday").onclick = () => setFilter("today");
$("bWeek").onclick = () => setFilter("week");
$("bAll").onclick = () => setFilter("all");
$("bRefresh").onclick = load;
$("classCode").onchange = () => {
  classCode = $("classCode").value.trim().toUpperCase();
  load();
};

function timeAgo(iso) {
  const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}

async function load() {
  $("status").textContent = "Loading…";
  try {
    let q = sb.from("leaderboard")
      .select("nickname, score, time_left, hints, mistakes, created_at, class_code")
      .order("score", { ascending: false })
      .limit(50);

    if (filter === "today") {
      const start = new Date();
      start.setUTCHours(0,0,0,0);
      q = q.gte("created_at", start.toISOString());
    } else if (filter === "week") {
      const start = new Date();
      start.setUTCDate(start.getUTCDate() - start.getUTCDay());
      start.setUTCHours(0,0,0,0);
      q = q.gte("created_at", start.toISOString());
    }

    if (classCode) {
      q = q.eq("class_code", classCode);
    }

    const { data, error } = await q;
    if (error) throw error;

    const tbody = $("rows");
    tbody.textContent = "";

    if (!data || data.length === 0) {
      $("status").textContent = "No scores yet. Be the first!";
      return;
    }

    data.forEach((r, i) => {
      const tr = document.createElement("tr");
      // Highlight if this browser has a stored nickname match (simple local only)
      const me = localStorage.getItem("a13_nick");
      if (me && me === r.nickname) tr.classList.add("me");

      const cells = [
        String(i + 1),
        r.nickname,
        String(r.score),
        Math.round(r.time_left) + "s",
        String(r.hints),
        String(r.mistakes),
        timeAgo(r.created_at)
      ];
      cells.forEach((txt, idx) => {
        const td = document.createElement("td");
        td.textContent = txt;
        if (idx === 0) td.className = "rank";
        if (idx === 2) td.className = "score";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    $("status").textContent = data.length + " entries · updated " + new Date().toLocaleTimeString();
  } catch (e) {
    console.error(e);
    $("status").textContent = "Could not load leaderboard. Check connection or config.";
  }
}

// Auto-refresh
function startAuto() {
  clearInterval(timer);
  timer = setInterval(load, 10000);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearInterval(timer);
  else { load(); startAuto(); }
});

load();
startAuto();
</script>
</body>
</html>
